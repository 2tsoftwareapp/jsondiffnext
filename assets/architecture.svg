<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">jsondiffnext processing pipeline</title>
  <desc id="desc">JSON validation and admission checks, selected diff adapter, hash guarded bundle, and atomic staged patch application.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e5e7eb}
      .title{font-size:21px;font-weight:700}.sub{font-size:13px;fill:#9ca3af}.head{font-size:15px;font-weight:650}.body{font-size:12px;fill:#cbd5e1}.code{font:12px ui-monospace,monospace;fill:#7dd3fc}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="980" height="390" rx="18" fill="url(#bg)" stroke="#334155"/>
  <text x="32" y="43" class="title">jsondiffnext · processing pipeline</text>
  <text x="32" y="68" class="sub">Selectable diff engines with validation, guarded bundles, and staged patch operations</text>
  <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <path d="M205 185h34"/><path d="M430 185h34"/><path d="M655 185h34"/><path d="M880 185h34"/>
  </g>
  <g>
    <rect x="30" y="112" width="175" height="144" rx="12" fill="#172554" stroke="#60a5fa"/>
    <text x="48" y="144" class="head">JSON inputs</text>
    <text x="48" y="174" class="body">Shape and data checks</text><text x="48" y="197" class="body">Depth/work admission</text>
    <text x="48" y="231" class="code">diff(before, after)</text>

    <rect x="255" y="112" width="175" height="144" rx="12" fill="#312e81" stroke="#a78bfa"/>
    <text x="273" y="144" class="head">Diff adapter</text>
    <text x="273" y="174" class="body">fast-json-patch</text><text x="273" y="197" class="body">jsondiffpatch · rfc6902</text>
    <text x="273" y="231" class="code">position or keyed arrays</text>

    <rect x="480" y="112" width="175" height="144" rx="12" fill="#064e3b" stroke="#34d399"/>
    <text x="498" y="144" class="head">Guarded bundle</text>
    <text x="498" y="174" class="body">Forward + inverse deltas</text><text x="498" y="197" class="body">JCS SHA-256 endpoints</text>
    <text x="498" y="231" class="code">HashPatchBundle v1</text>

    <rect x="705" y="112" width="175" height="144" rx="12" fill="#713f12" stroke="#fbbf24"/>
    <text x="723" y="144" class="head">Apply / revert</text>
    <text x="723" y="174" class="body">Stage on cloned data</text><text x="723" y="197" class="body">Validate, then return</text>
    <text x="723" y="231" class="code">caller input stays owned</text>
  </g>
  <rect x="30" y="290" width="920" height="64" rx="10" fill="#111827" stroke="#334155"/>
  <text x="50" y="316" class="head">Default admission limits</text>
  <text x="50" y="339" class="body">maxWork 20,000,000 · maxDepth 256 · limits are configurable within implementation constraints; fallback behavior depends on engine and input.</text>
</svg>
