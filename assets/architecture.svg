<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0e495f" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb7185" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .box-title { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; font-weight: 700; }
    .box-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; }
    .code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; fill: #38bdf8; }
    .tag { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 9px; font-weight: 600; text-anchor: middle; }
    .connector { stroke: #38bdf8; stroke-width: 1.75; fill: none; stroke-linecap: round; }
    .dashed { stroke-dasharray: 4,4; }
  </style>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="920" height="440" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="440" /><line x1="160" y1="0" x2="160" y2="440" />
    <line x1="280" y1="0" x2="280" y2="440" /><line x1="400" y1="0" x2="400" y2="440" />
    <line x1="520" y1="0" x2="520" y2="440" /><line x1="640" y1="0" x2="640" y2="440" />
    <line x1="760" y1="0" x2="760" y2="440" /><line x1="880" y1="0" x2="880" y2="440" />
    <line x1="0" y1="80" x2="920" y2="80" /><line x1="0" y1="160" x2="920" y2="160" />
    <line x1="0" y1="240" x2="920" y2="240" /><line x1="0" y1="320" x2="920" y2="320" />
    <line x1="0" y1="400" x2="920" y2="400" />
  </g>

  <!-- Header -->
  <circle cx="36" cy="36" r="6" fill="#10b981" />
  <circle cx="36" cy="36" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
  <text x="56" y="38" class="title">JSONDiffNext — Zero-Trust Security &amp; Execution Pipeline</text>
  <text x="56" y="54" class="subtitle">Multi-Engine Hardening, Admission Defense &amp; Hash Guard Protocol v1</text>

  <!-- Connectors -->
  <path d="M 180 180 L 220 180" class="connector" marker-end="url(#arrow)" />
  <path d="M 370 180 L 410 180" class="connector" marker-end="url(#arrow)" />
  <path d="M 560 180 L 600 180" class="connector" marker-end="url(#arrow)" />
  <path d="M 750 180 L 780 180" class="connector" marker-end="url(#arrow)" />

  <!-- Admission Fallback Connector -->
  <path d="M 300 250 L 300 340 L 660 340 L 660 255" stroke="#fb7185" stroke-width="1.5" fill="none" stroke-dasharray="4,4" marker-end="url(#arrowRose)" />
  <text x="480" y="332" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Fallback: native-admission-root-replace (if work &gt; 500k or depth &gt; 64)</text>

  <!-- STAGE 1: Input -->
  <g transform="translate(30, 100)">
    <rect width="150" height="150" rx="10" fill="url(#cyanGrad)" stroke="#22d3ee" stroke-width="1.5" />
    <rect x="12" y="14" width="56" height="18" rx="4" fill="#083344" />
    <text x="40" y="26" class="tag" fill="#38bdf8">INPUT</text>
    <text x="14" y="52" class="box-title" fill="#e0f2fe">Untrusted JSON</text>
    <text x="14" y="74" class="box-desc">• Arbitrary inputs</text>
    <text x="14" y="92" class="box-desc">• Deeply nested keys</text>
    <text x="14" y="110" class="box-desc">• Null-prototypes</text>
    <text x="14" y="128" class="box-desc">• Reordered arrays</text>
    <text x="14" y="144" class="code">diff(left, right)</text>
  </g>

  <!-- STAGE 2: Security & Admission Scanner -->
  <g transform="translate(220, 100)">
    <rect width="150" height="150" rx="10" fill="url(#roseGrad)" stroke="#fb7185" stroke-width="1.5" />
    <rect x="12" y="14" width="62" height="18" rx="4" fill="#4c0519" />
    <text x="43" y="26" class="tag" fill="#fda4af">STAGE 1</text>
    <text x="14" y="52" class="box-title" fill="#ffe4e6">Guard Scanner</text>
    <text x="14" y="74" class="box-desc">🛡️ __proto__ blocked</text>
    <text x="14" y="92" class="box-desc">🛡️ constructor safe</text>
    <text x="14" y="110" class="box-desc">⏱️ maxWork: 20M</text>
    <text x="14" y="128" class="box-desc">🌲 maxDepth: 256</text>
    <text x="14" y="144" class="code">scanJson() &amp; check</text>
  </g>

  <!-- STAGE 3: Multi-Engine Adapter -->
  <g transform="translate(410, 100)">
    <rect width="150" height="150" rx="10" fill="url(#violetGrad)" stroke="#a78bfa" stroke-width="1.5" />
    <rect x="12" y="14" width="62" height="18" rx="4" fill="#2e1065" />
    <text x="43" y="26" class="tag" fill="#c4b5fd">STAGE 2</text>
    <text x="14" y="52" class="box-title" fill="#f5f3ff">Diff Adapters</text>
    <rect x="14" y="65" width="122" height="20" rx="4" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
    <text x="20" y="79" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a78bfa">⚡ fast-json-patch</text>
    <text x="14" y="104" class="box-desc">• jsondiffpatch (LCS)</text>
    <text x="14" y="122" class="box-desc">• rfc6902 (RFC 6902)</text>
    <text x="14" y="144" class="code">mode: keyed | position</text>
  </g>

  <!-- STAGE 4: Hash Guard v1 Protocol -->
  <g transform="translate(600, 100)">
    <rect width="150" height="150" rx="10" fill="url(#emeraldGrad)" stroke="#34d399" stroke-width="1.5" />
    <rect x="12" y="14" width="76" height="18" rx="4" fill="#022c22" />
    <text x="50" y="26" class="tag" fill="#6ee7b7">PROTOCOL v1</text>
    <text x="14" y="52" class="box-title" fill="#ecfdf5">Hash Guard</text>
    <text x="14" y="74" class="box-desc">🔑 RFC 8785 (JCS)</text>
    <text x="14" y="92" class="box-desc">🔒 SHA-256 baseHash</text>
    <text x="14" y="110" class="box-desc">🔒 SHA-256 resultHash</text>
    <text x="14" y="128" class="box-desc">✂️ Delta stripping</text>
    <text x="14" y="144" class="code">canonicalHash()</text>
  </g>

  <!-- STAGE 5: Output -->
  <g transform="translate(780, 100)">
    <rect width="110" height="150" rx="10" fill="url(#amberGrad)" stroke="#fbbf24" stroke-width="1.5" />
    <rect x="12" y="14" width="56" height="18" rx="4" fill="#451a03" />
    <text x="40" y="26" class="tag" fill="#fde68a">BUNDLE</text>
    <text x="14" y="52" class="box-title" fill="#fffbeb">Immutable</text>
    <text x="14" y="74" class="box-desc">❄️ Deep freeze</text>
    <text x="14" y="92" class="box-desc">⚛️ Atomic staging</text>
    <text x="14" y="110" class="box-desc">🔁 Revertible</text>
    <text x="14" y="130" class="box-desc">📦 Cross-engine</text>
    <text x="14" y="144" class="code">v1 Bundle</text>
  </g>

  <!-- Bottom Comparison Card -->
  <g transform="translate(30, 375)">
    <rect width="860" height="45" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Zero-Trust Guarantee:</text>
    <text x="180" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1"><tspan fill="#34d399">✔</tspan> Zero prototype pollution  |  <tspan fill="#34d399">✔</tspan> Bounded memory &amp; CPU  |  <tspan fill="#34d399">✔</tspan> Atomic apply (zero partial corruption)  |  <tspan fill="#34d399">✔</tspan> SHA-256 Verified base/result</text>
  </g>
</svg>
