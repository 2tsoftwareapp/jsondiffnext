<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">jsondiffnext exploratory benchmark summary</title>
  <desc id="desc">Median across 19 cell-level medians: end-to-end time and hash share for three adapters.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e5e7eb}
      .muted{fill:#9ca3af}.small{font-size:12px}.label{font-size:14px}.title{font-size:21px;font-weight:700}.head{font-size:15px;font-weight:650}
      .mono{font-family:ui-monospace,monospace;font-size:13px;font-weight:600}
    </style>
  </defs>
  <rect width="920" height="500" rx="18" fill="url(#bg)" stroke="#334155"/>
  <text x="32" y="42" class="title">jsondiffnext · exploratory wrapper measurements</text>
  <text x="32" y="66" class="small muted">Node.js isolated workers · 19 fixture/mode cells per adapter · 21 samples per cell</text>
  <text x="32" y="108" class="head">Median of cell-level E2E p50s (ms) · lower is faster</text>
  <text x="320" y="136" class="small muted">0</text><text x="725" y="136" class="small muted">80 ms</text>
  <g>
    <text x="32" y="165" class="label">fast-json-patch</text><rect x="190" y="147" width="306" height="25" rx="5" fill="#38bdf8"/><text x="506" y="165" class="mono">60.39</text>
    <text x="32" y="207" class="label">jsondiffpatch</text><rect x="190" y="189" width="146" height="25" rx="5" fill="#fb7185"/><text x="346" y="207" class="mono">28.84</text>
    <text x="32" y="249" class="label">rfc6902</text><rect x="190" y="231" width="101" height="25" rx="5" fill="#a78bfa"/><text x="301" y="249" class="mono">19.89</text>
  </g>
  <line x1="32" y1="276" x2="888" y2="276" stroke="#334155"/>
  <text x="32" y="308" class="head">Median hash share of E2E p50s (%) · earlier 5% target not met</text>
  <text x="320" y="336" class="small muted">0</text><text x="725" y="336" class="small muted">50%</text>
  <g>
    <text x="32" y="365" class="label">fast-json-patch</text><rect x="190" y="347" width="125" height="25" rx="5" fill="#38bdf8"/><text x="325" y="365" class="mono">15.44%</text>
    <text x="32" y="407" class="label">jsondiffpatch</text><rect x="190" y="389" width="182" height="25" rx="5" fill="#fb7185"/><text x="382" y="407" class="mono">22.46%</text>
    <text x="32" y="449" class="label">rfc6902</text><rect x="190" y="431" width="311" height="25" rx="5" fill="#a78bfa"/><text x="511" y="449" class="mono">38.36%</text>
  </g>
  <text x="660" y="490" class="small muted">One run; exploratory, not a throughput guarantee.</text>
</svg>
