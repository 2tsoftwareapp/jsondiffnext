<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="barFast" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="barRfc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="barJdp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .label { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; fill: #cbd5e1; }
    .val-text { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; font-weight: 600; fill: #f8fafc; }
    .sec-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }
    .legend-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="920" height="480" rx="16" fill="url(#bgDark)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid decoration -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="920" y2="80" /><line x1="0" y1="280" x2="920" y2="280" />
    <line x1="460" y1="80" x2="460" y2="480" />
  </g>

  <!-- Header -->
  <circle cx="36" cy="36" r="6" fill="#38bdf8" />
  <circle cx="36" cy="36" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  <text x="56" y="38" class="title">JSONDiffNext — Benchmark &amp; Resource Telemetry</text>
  <text x="56" y="54" class="subtitle">57 Cells Matrix · 21 Samples/Cell · Isolated Node v24 Child Workers · Bounded CPU &amp; Heap</text>

  <!-- LEGEND -->
  <g transform="translate(560, 26)">
    <rect x="0" y="4" width="12" height="12" rx="3" fill="url(#barFast)" />
    <text x="18" y="14" class="legend-item"><tspan font-weight="700" fill="#38bdf8">fast-json-patch</tspan> (default)</text>
    <rect x="155" y="4" width="12" height="12" rx="3" fill="url(#barRfc)" />
    <text x="173" y="14" class="legend-item">rfc6902</text>
    <rect x="245" y="4" width="12" height="12" rx="3" fill="url(#barJdp)" />
    <text x="263" y="14" class="legend-item">jsondiffpatch</text>
  </g>

  <!-- LEFT PANEL: End-to-End Latency (p50 ms) -->
  <g transform="translate(30, 90)">
    <text x="0" y="20" class="sec-head">End-to-End Latency (Lower is Better)</text>
    <text x="0" y="36" class="subtitle">Diff + Hash Guard v1 + Stringify/Parse + Verify + Atomic Apply (Median p50)</text>

    <!-- Fixture 1: Medium Flat 50 -->
    <g transform="translate(0, 50)">
      <text x="0" y="12" class="label">medium-flat-50</text>
      <rect x="160" y="0" width="16" height="15" rx="3" fill="url(#barFast)" />
      <text x="182" y="12" class="val-text" fill="#38bdf8">0.16 ms</text>
      <rect x="245" y="0" width="29" height="15" rx="3" fill="url(#barRfc)" />
      <text x="280" y="12" class="val-text" fill="#a78bfa">0.29 ms</text>
      <rect x="345" y="0" width="39" height="15" rx="3" fill="url(#barJdp)" />
      <text x="390" y="12" class="val-text" fill="#fb7185">0.39 ms</text>
    </g>

    <!-- Fixture 2: Array Move/Edit 500 -->
    <g transform="translate(0, 85)">
      <text x="0" y="12" class="label">array-move-edit-500</text>
      <rect x="160" y="0" width="55" height="15" rx="3" fill="url(#barFast)" />
      <text x="222" y="12" class="val-text" fill="#38bdf8">2.75 ms</text>
      <rect x="160" y="18" width="114" height="15" rx="3" fill="url(#barRfc)" />
      <text x="280" y="30" class="val-text" fill="#a78bfa">5.69 ms</text>
      <rect x="160" y="36" width="236" height="15" rx="3" fill="url(#barJdp)" />
      <text x="402" y="48" class="val-text" fill="#fb7185">11.81 ms <tspan font-size="9" fill="#94a3b8">(4.3x slower)</tspan></text>
    </g>

    <!-- Fixture 3: Sparse Array 2000 -->
    <g transform="translate(0, 155)">
      <text x="0" y="12" class="label">sparse-array-2000</text>
      <rect x="160" y="0" width="38" height="15" rx="3" fill="url(#barFast)" />
      <text x="204" y="12" class="val-text" fill="#38bdf8">1.93 ms</text>
      <rect x="160" y="18" width="36" height="15" rx="3" fill="url(#barRfc)" />
      <text x="202" y="30" class="val-text" fill="#a78bfa">1.84 ms <tspan font-size="9" fill="#94a3b8">(fallback)</tspan></text>
      <rect x="160" y="36" width="276" height="15" rx="3" fill="url(#barJdp)" />
      <text x="442" y="48" class="val-text" fill="#fb7185">13.84 ms <tspan font-size="9" fill="#94a3b8">(7.2x slower)</tspan></text>
    </g>

    <!-- Fixture 4: Adversarial Disjoint 2000 -->
    <g transform="translate(0, 225)">
      <text x="0" y="12" class="label">adversarial-2000</text>
      <rect x="160" y="0" width="40" height="15" rx="3" fill="url(#barFast)" />
      <text x="206" y="12" class="val-text" fill="#38bdf8">1.98 ms</text>
      <rect x="160" y="18" width="38" height="15" rx="3" fill="url(#barRfc)" />
      <text x="204" y="30" class="val-text" fill="#a78bfa">1.90 ms <tspan font-size="9" fill="#94a3b8">(fallback)</tspan></text>
      <rect x="160" y="36" width="280" height="15" rx="3" fill="url(#barJdp)" />
      <text x="446" y="48" class="val-text" fill="#fb7185">14.03 ms</text>
    </g>
  </g>

  <!-- RIGHT PANEL TOP: Hash Guard Overhead -->
  <g transform="translate(490, 90)">
    <text x="0" y="20" class="sec-head">Hash Guard Protocol v1 Overhead</text>
    <text x="0" y="36" class="subtitle">RFC 8785 Canonical JSON Serialization + SHA-256 vs Total E2E Time</text>

    <!-- Progress Meter -->
    <g transform="translate(0, 50)">
      <rect width="400" height="24" rx="6" fill="#1e293b" />
      <rect width="75" height="24" rx="6" fill="url(#gaugeGrad)" />
      <!-- Target mark at 5% -->
      <line x1="200" y1="-4" x2="200" y2="28" stroke="#fb7185" stroke-width="2" stroke-dasharray="3,3" />
      <text x="200" y="-8" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fb7185" text-anchor="middle">5.0% SLA Target</text>

      <text x="85" y="16" class="val-text" fill="#34d399">0.94% Median Overhead</text>
    </g>

    <!-- Stat cards -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="125" height="55" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text x="12" y="20" class="subtitle">Median Overhead</text>
      <text x="12" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#10b981">0.94%</text>

      <rect x="135" y="0" width="125" height="55" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text x="147" y="20" class="subtitle">Hashing Latency</text>
      <text x="147" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#38bdf8">4 µs <tspan font-size="10" fill="#94a3b8">p50</tspan></text>

      <rect x="270" y="0" width="130" height="55" rx="6" fill="#0f172a" stroke="#1e293b" />
      <text x="282" y="20" class="subtitle">Deterministic</text>
      <text x="282" y="42" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#a78bfa">57 / 57</text>
    </g>
  </g>

  <!-- RIGHT PANEL BOTTOM: Memory Safety Sweep -->
  <g transform="translate(490, 275)">
    <text x="0" y="20" class="sec-head">Adaptive Admission vs Call-Stack Explosion</text>
    <text x="0" y="36" class="subtitle">Peak Worker RSS &amp; Heap Delta Across Scale (n = 2,000 → 20,000)</text>

    <!-- Comparison Table / Bars -->
    <g transform="translate(0, 50)">
      <!-- Row 1: n = 2000 -->
      <text x="0" y="14" class="label">n = 2,000</text>
      <rect x="90" y="2" width="160" height="16" rx="3" fill="#0284c7" />
      <text x="256" y="14" class="val-text" fill="#e0f2fe">161 MiB <tspan font-size="9" fill="#94a3b8">(Native diff)</tspan></text>

      <!-- Row 2: n = 10000 -->
      <text x="0" y="42" class="label">n = 10,000</text>
      <rect x="90" y="30" width="220" height="16" rx="3" fill="#0284c7" />
      <text x="316" y="42" class="val-text" fill="#e0f2fe">313 MiB <tspan font-size="9" fill="#94a3b8">(Native diff)</tspan></text>

      <!-- Row 3: n = 20000 (ADMISSION ACTIVATED) -->
      <text x="0" y="70" class="label">n = 20,000</text>
      <rect x="90" y="58" width="198" height="16" rx="3" fill="#10b981" />
      <text x="294" y="70" class="val-text" fill="#6ee7b7">198 MiB <tspan font-size="9" fill="#34d399">🛡️ Admission Fallback Active</tspan></text>
      <line x1="90" y1="80" x2="400" y2="80" stroke="#fb7185" stroke-width="1" stroke-dasharray="2,2" />
      <text x="90" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#fb7185">⚡ Unprotected rfc6902: RangeError (Maximum call stack size exceeded at n &gt; 10k)</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(30, 435)">
    <rect width="860" height="32" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Verdict:</text>
    <text x="85" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1"><tspan fill="#34d399">fast-json-patch</tspan> wins 31/38 comparisons (median 2.1x speedup) · Hash overhead strictly <tspan fill="#34d399">&lt; 1.5%</tspan> · Zero memory leaks</text>
  </g>
</svg>
